name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
      TZ: America/Sao_Paulo
      # CI never connects to production or runs migrations.
      DATABASE_URL: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Install pnpm matching Dockerfile
        run: npm install --global pnpm@10.4.1
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm check
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
